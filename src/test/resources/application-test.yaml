spring:
  application:
    name: hardware_store
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql
  mail:
    host: localhost
    port: 25
    username:
    password:
  h2:
    console:
      enabled: true

logging:
  level:
    org.springframework.boot: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    tn.inovexahub.hardware_store: DEBUG

server:
  port: 8081

otp:
  expiry-minutes: 10

jwt:
  secret: test-secret-key-for-testing-must-be-at-least-256-bits-long-for-security
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1200000}
